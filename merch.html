d;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.merch-card{background:#fff;border:0;display:flex;flex-direction:column;overflow:visible;text-align:center;transition:.18s}.merch-card:hover{transform:translateY(-3px);box-shadow:none}.merch-image{aspect-ratio:1/1;height:auto;background:#f3f1ee;overflow:hidden;position:relative;border-radius:5px}.merch-image img{position:absolute;width:155%;height:auto;max-width:none;left:50%;top:44%;transform:translate(-50%,-50%);display:block}.merch-info{padding:10px 5px 0;display:flex;flex-direction:column;align-items:center;flex:1}.merch-type{display:none}.merch-card h3{font:500 14px/1.25 var(--body);margin:0 0 4px;color:#221a17}.merch-card p{display:none}.merch-bottom{margin-top:auto;display:flex;flex-direction:column;align-items:center;width:100%;gap:9px}.merch-price{font-size:14px;font-weight:700;color:#221a17}.merch-shop{width:80%;background:#c45f3a;color:#fff;border:0;border-radius:99px;padding:10px 8px;font-size:11px;text-transform:none;letter-spacing:0;font-weight:700}.store-cta{margin:20px clamp(24px,6vw,90px) 65px;background:#f4e7df;color:#6d2b1d;padding:42px;text-align:center;border-radius:8px}.store-cta h2{font:600 34px var(--display);margin:0 0 8px}.store-cta .button{background:#c45f3a;color:#fff;display:inline-block;margin-top:15px;border-radius:99px}footer{background:#fff}@media(max-width:1050px){.merch-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.merch-grid{grid-template-columns:repeat(2,1fr);gap:12px}.merch-hero{padding-top:28px}.merch-card h3{font-size:13px}.merch-shop{width:92%}.cat-head{align-items:end}.cat-head span{font-size:10px}.merch-wrap{padding:0 15px 35px}}@media(max-width:430px){.merch-grid{grid-template-columns:1fr 1fr}.merch-image img{width:165%}.modebar button{padding:10px 16px}}</style></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">TF</span><span>The Find List</span></a><button class="menu-toggle" aria-label="Open navigation">Menu</button><nav class="nav-links"><a href="index.html">Home</a><a href="index.html#categories">Shop</a><a href="blog/index.html">Articles</a><a href="on-sale.html">On Sale</a><a href="about.html">About</a><a href="merch.html"><strong>🛍 Merch</strong></a></nav></header><main><section class="merch-hero"><h1>The Find List <em>Merch</em></h1><p>Cozy designs for your everyday life ♡</p></section><div class="modebar"><button id="byProduct" class="active">All Products</button><button id="byDesign">Shop by Design</button></div><nav class="jump" id="jump"></nav><div class="merch-wrap" id="shop"></div><section class="store-cta"><h2>Cozy finds, happier days.</h2><p>Browse the complete collection on our Printify storefront.</p><a class="button" href="https://the-find-list.printify.me/products" target="_blank">View full shop</a></section></main><footer><div class="footer-bottom"><span>© <span id="year"></span> The Find List</span><span>Made for better browsing.</span></div></footer><script>const items=[['31653435','Spice Season','Sweatshirt','$29.78','Pumpkin spice latte & autumn leaves crewneck.'],['31653434','Spice Season','Mug','$12.99','Pumpkin spice latte coffee mug.'],['31653436','Spice Season','Woven Blanket','$38.48','Pumpkin spice coffee fall throw.'],['31653402','More Good Days','Sweatshirt','$29.78','Optimistic sunrise graphic.'],['31653423','More Good Days','Mug','$10.73','Positive sunrise typography.'],['31653401','Just a Girl Who Loves Fall','Sweatshirt','$29.78','Autumn script, bow & leaf design.'],['31653399','Just a Girl Who Loves Fall','Mug','$12.99','Autumn leaves and bow mug.'],['31653400','Just a Girl Who Loves Fall','Woven Blanket','$38.48','Cozy autumn throw.'],['31653397','In My Cozy Era','Sweatshirt','$29.78','Retro hearts and cozy vibes.'],['31653395','In My Cozy Era','Mug','$12.99','Retro hearts and warm typography.'],['31653396','In My Cozy Era','Woven Blanket','$38.48','Retro heart neutral boho throw.'],['31653383','Seasonal State of Mind items.filter(x=>x[1]==n)]))}function render(groups){jump.innerHTML=groups.map(g=>`<a href="#${slug(g[0])}">${g[0]}</a>`).join('');shop.innerHTML=groups.map(g=>`<section class="cat" id="${slug(g[0])}"><div class="cat-head"><h2>${g[0]}</h2><span>View All →</span></div><div class="merch-grid">${g[1].map(card).join('')}</div></section>`).join('')}byProduct.onclick=()=>{byProduct.classList.add('active');byDesign.classList.remove('active');renderProduct()};byDesign.onclick=()=>{byDesign.classList.add('active');byProduct.classList.remove('active');renderDesign()};renderProduct();year.textContent=new Date().getFullYear();let t=document.querySelector('.menu-toggle'),n=document.querySelector('.nav-links');t.onclick=()=>n.classList.toggle('open')</script></body></html>
